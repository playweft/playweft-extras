<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1019">
  <title>Playweft Extras</title>
  <link rel="stylesheet" href="./src/home.css">
</head>
<body>
  <main>
    <header><p>PLAYWEFT EXTRAS</p><h1>来试点新玩法。</h1><p>创意玩法与持续迭代的小游戏。</p></header>
    <a class="game-card" href="./light-trails/">
      <img src="/light-trails/icon.svg" width="72" height="72" alt="">
      <div><h2>光尾蛇</h2><p>左右转向，别撞墙和任何尾迹。</p><span>2 人 · 实时对战</span></div>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
    <a class="game-card" href="./pupdoku/">
      <img src="/pupdoku/icon.svg" width="72" height="72" alt="">
      <div><h2>小狗数独</h2><p>每行、每列、每个色块各一只，不能贴贴。</p><span>1 人 · 逻辑解谜</span></div>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
    <a class="game-card" href="./fuzzy-match-3/">
      <img src="/fuzzy-match-3/icon.svg" width="72" height="72" alt="">
      <div><h2>绒绒消消乐</h2><p>交换动物棋子，挑战四种关卡目标。</p><span>1 人 · 休闲三消</span></div>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
    <a class="game-card" href="./bubble-kick/">
      <img src="/bubble-kick/icon.svg" width="72" height="72" alt="">
      <div><h2>泡泡球场</h2><p>踢走定时糖泡，躲避连锁爆炸，救回队友。</p><span>1–4 人 · 踢炸弹对战</span></div>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
    <p class="help">单人游戏可以直接开始；多人游戏在 Playweft 创建房间后邀请好友。</p>
  </main>
</body>
</html>
